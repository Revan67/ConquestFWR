[Video]
GDI = on                 ; on  = GDI compatible with full screen 3D

;
; Defines the DLL's to load
;
[Libraries]
DOSFile.dll
x86math.dll
System.dll
Channel.dll
Anim.dll
Engine.dll
PolyMesh.dll
RenderMgr.dll
TextureLibrary.dll
optics.dll
Hardpoint.dll
Streamer.dll
LightManager.dll
VertexBufferManager.dll
D3DRenderPipe.dll
VideoSystem.dll
MaterialManager.dll
ParticleEffect.dll
MeshManager.dll
TextureManager.dll

[System]
IEventSystem
IRenderPrimitive
IRenderPipeline = RendSft
IStreamer
TextureLibrary
LightManager
VertexBufferManager
IVideoSystem
IMaterialManager
IParticleManager
IMeshManager
ITManager

[Engine]
IRenderer 
IAnimation
IHardpoint

[RenderManager]	; Add if you plan on rendering anything
PolyMesh		; The order defines the order components get a chance to
Optics			; create instances and archetypes.

;WARNING: DO NOT EDIT THE FOLLOWING RendX sections!!
[Rend0]
DeviceId = {00000000-0000-0000-0000-000000000000}
DeviceType = T&L

[Rend1]
DeviceId = {00000000-0000-0000-0000-000000000000}
DeviceType = T&L

[Rend2]
DeviceId = {00000000-0000-0000-0000-000000000000}
DeviceType = T&L

[Rend3]
DeviceId = {00000000-0000-0000-0000-000000000000}
DeviceType = T&L

[RendSft]
DeviceType = SFT

[TextureLibrary]
;TEXTURE_LOD_LOAD_BIAS = 0
;TEXTURE_LOD_LOAD_SCALE = 0.5

[Polymesh]
ContLodMode = 2  //0 disable, 1 per instance lod(default), 2 per archetype lod

[RenderOptions]
NoPerVertexAlpha = off
32BitTextures = off

[TextureFormatClasses]
DAO8 = 24:8:8:8:0, 32:8:8:8:8, 16:5:6:5:0, 16:5:5:5:0, 16:5:5:5:1

[TextureFormatMaps]
clear                           ;; clear the table
8:8:8:8:*,0 = DAOP
*:*:*:*:1,0 = DAA1
*:*:*:*:4,0 = DAA4
*:*:*:*:8,0 = DAA8
;24:*:*:*:*,0 = DAO8   ;uncomment this line for 32 bit textures
*:*:*:*:*,0 = DAOT
*:*:*:*:*,1 = DAA1
*:*:*:*:*,4 = DAA4
*:*:*:*:*,* = DAA8
