;; DACOM.ini
;;
;; 
;;

;; ..........................................................................
;; Application Settings
;;
;; Sets options used by the main application.
;;
[Application]
Width = 640
Height = 480
DefaultWindowType = CDALibs_3DWindow

;;DefaultWindowType = CDALibs_TextureLibraryTestWindow
;;DefaultWindowType = CDALibs_TextureTestWindow
;;DefaultWindowType = CDALibs_GammaTestWindow


;; ..........................................................................
;; Cameras
;;
;; These define some "user cameras."  User cameras are loaded by different
;; objects in the application.  For example, users can define cameras to
;; be used in every CDALibs_3DWindow by defining the "Cameras" key of
;; the CDALibs_3DWindow section below.
;;
;; A camera named "DefaultCamera" *MUST* exist in order to use CDALibs_3DWindow.
;;

[LongShot]
Position = -50, 0,-100
Target = 0, 0, 0
Up = -1, 0, 0
HorizontalFOV = 60
Aspect = 1.3333
NearPlane = 1.0
FarPlane = 1000.0

[XY]
Position = 0,0,100
Target = 0, 0, 0
Up = 0, 1, 0
HorizontalFOV = 60
Aspect = 1.3333
NearPlane = 1.0
FarPlane = 1000.0

[XZ]
Position = 0,100,0
Target = 0, 0, 0
Up = 0, 0, 1
HorizontalFOV = 60
Aspect = 1.3333
NearPlane = 1.0
FarPlane = 1000.0

[YZ]
Position = 100,0,0
Target = 0, 0, 0
Up = 0, 0, 1
HorizontalFOV = 60
Aspect = 1.3333
NearPlane = 1.0
FarPlane = 1000.0

[DefaultCamera]
Position = 15, 15, 15
Target = 0, 0, 0
Up = 0, 1, 0
HorizontalFOV = 60
Aspect = 1.3333
NearPlane = 1.0
FarPlane = 1000.0
VisualRepresentation = E:\Data\Objects\Camera.3db
VisualRepresentation


;; ..........................................................................
;; Lights
;;
;; These define some "user lights."  User lights are loaded by different
;; objects in the application.  For example, users can define lights to
;; be used in every CDALibs_3DWindow by defining the "Lights" key of
;; the CDALibs_3DWindow section below.
;;
[DefaultLight]
Position = 15,15,15
Color = 255, 255, 255
Direction = 1,0,0
Range = 1000
Cutoff = 1000

[LightA]
Position = 0, 400, 0
Color = 255, 255, 255
Direction = 0,1,0
Range = 1000
Cutoff = 1000


;; ..........................................................................
;; Content Map
;;
;; This maps strings to the component class id that can load that type of
;; content.  The string that is used for comparison comes from either
;; a) the content type specified when opening the file, or
;; b) the filename extension if a) is NULL.
;;
[Content Map]
.cmp = CDALibs_Renderable
.3db = CDALibs_Renderable
.pte = CDALibs_Renderable
.ovc = CDALibs_Camera
.camera = CDALibs_Camera
.ovl = CDALibs_Light
.light = CDALibs_Light
Default = CDALibs_Renderable


;; ..........................................................................
;; Component Settings
;; 
;; From here to EOF are settings for individual components.
;;

;; ..........................................................................
;; CDALibs_3DWindow
;;
;; The 3DWindow component loads all of its defaults from the ini file.
;;
[CDALibs_3DWindow]
ViewWorldAxis = 1
AmbientLight = 128, 128, 128
Width = 640
Height = 480
Camera = DefaultCamera
Cameras = XY, XZ, YZ, LongShot
Lights = DefaultLight, LightA

;; ..........................................................................
;; CDALibs_TextureWindow
;;
;; The TextureWindow defaults.
;;
[CDALibs_TextureWindow]
Width = 800
Height = 350

;; ..........................................................................
;; RenderPipeline Component Settings
;;
;; Set which components are aggregated into the Engine container
;;
[RenderPipeline]
BUFFERS_FULLSCREEN=false
;GSlope = 1.5
;GBlackness = 0.1
;GBias = 1.0
;Gamma = 4.0


;; ..........................................................................
;; Engine Component Settings
;;
;; Set which components are aggregated into the Engine container
;;
[Engine]
IModel
IRenderer
ITXMLib
IPhysics
IChannel
IAnimation
IHardpoint


;; ..........................................................................
;; System Component Settings
;;
;; Set which components are aggregated into the System container.
;;
[System]
IRenderPipeline = {Direct3D,{00000000-0000-0000-0000-000000000000}}
;;ITextureLibrary
;;IRenderPrimitive
;;IRenderPipeline = {Direct3D,{3A0CFD01-9320-11cf-ACA1-00A02413C2E2}}
;;IRenderPipeline = {Direct3D,{6768555A-3106-11d0-B971-00AA00342F9F}}
;;IRenderPipeline = {OpenGL}
;;IRenderPipeline = {Raster}


;; ..........................................................................
;; Libraries
;;
;; Set which DLLs to load (and therefore which components are available).
;;
[Libraries]
dosfile.dll
;;TextureLibrary.dll
engine.dll
model.dll
polymesh.dll
;;TriMesh.dll
rendermgr.dll
trap.dll
txmlib.dll
x86math.dll
physics.dll
optics.dll
anim.dll
channel.dll
hardpoint.dll
audio.dll
system.dll
D3DRenderPipe.DLL
;;RenderBatcher.dll
;;ZRasterRenderPipe.DLL
;;GLRenderPipe.dll

