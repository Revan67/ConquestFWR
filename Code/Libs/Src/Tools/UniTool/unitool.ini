[TextureFormatMaps]
;; Format is:
;; bpp:rbits:gbits:bbits:abits:op_alpha_bits = TextureFormatClassFourCC
;;
clear				; clear table
8:8:8:8:*,0 = DAOP	; bpp < rbits+gbits+bbits+abits is indexed
*:*:*:*:1,0 = DAA1	; 
*:*:*:*:4,0 = DAA4	;
*:*:*:*:8,0 = DAA8	;
*:*:*:*:*,0 = DAOT	; 
*:*:*:*:*,1 = DAA1	;
*:*:*:*:*,4 = DAA4	;
*:*:*:*:*,* = DAA8	; when all else fails...

[TextureFormatClasses]
;; Format is:
;; TextureFormatClassFourCC = bpp:rbits:gbits:bbits:abits, ...
;;
clear				; clear table
DAOP =  8:8:8:8:0, 16:5:6:5:0, 16:5:5:5:0, 24:8:8:8:0, 32:8:8:8:8
DAOT = 16:5:6:5:0, 16:5:5:5:0, 24:8:8:8:0, 32:8:8:8:8
DAA1 = 16:5:5:5:1, 16:4:4:4:4, 32:8:8:8:8
DAA4 = 16:4:4:4:4, 16:5:5:5:1, 32:8:8:8:8
DAA8 = 32:8:8:8:8, 16:4:4:4:4, 16:5:5:5:1
